name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- Step baru: ambil tun2socks + Xray-core siap pakai, tanpa NDK/Go ---
    - name: Download prebuilt hev-socks5-tunnel.aar
      run: |
        mkdir -p app/libs
        AAR_URL=$(curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest \
          | grep -o '"browser_download_url": *"[^"]*\.aar"' \
          | sed -E 's/.*"(https:[^"]+)"/\1/' | head -n1)
        echo "URL asset .aar ditemukan: $AAR_URL"
        if [ -z "$AAR_URL" ]; then
          echo "::error::Tidak ada file .aar di rilis terbaru hev-socks5-tunnel — cek manual di https://github.com/heiher/hev-socks5-tunnel/releases"
          exit 1
        fi
        curl -L -o app/libs/hev-socks5-tunnel.aar "$AAR_URL"
        SIZE=$(stat -c%s app/libs/hev-socks5-tunnel.aar)
        echo "Ukuran file hasil download: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "::error::File .aar yang terdownload terlalu kecil ($SIZE bytes) — kemungkinan bukan file .aar asli. Isi file:"
          cat app/libs/hev-socks5-tunnel.aar
          exit 1
        fi
        ls -la app/libs/

    - name: Download prebuilt libv2ray.aar (Xray-core)
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/libv2ray.aar \
          https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
        SIZE=$(stat -c%s app/libs/libv2ray.aar)
        echo "Ukuran file hasil download: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "::error::libv2ray.aar yang terdownload terlalu kecil ($SIZE bytes) — kemungkinan bukan file .aar asli. Isi file:"
          cat app/libs/libv2ray.aar
          exit 1
        fi
        ls -la app/libs/
    # --- akhir step baru ---

    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ./debug.keystore || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true -x test -x testDebugUnitTest

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HN-Tunnel-APK
        path: app/build/outputs/apk/debug/*.apk
