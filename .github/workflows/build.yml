name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # --- Step baru: compile tun2socks (hev-socks5-tunnel) via NDK ---
    # (Tidak ada file .aar siap pakai untuk library ini, jadi kita compile
    # sendiri dari source-nya via ndk-build, sesuai instruksi resmi mereka)
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27c

    - name: Clone & build hev-socks5-tunnel (tun2socks)
      run: |
        mkdir -p hev-build
        cd hev-build
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel jni
        "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" -j$(nproc)
        echo "--- hasil build ---"
        find libs -type f

    - name: Salin .so hasil build ke app/src/main/jniLibs
      run: |
        mkdir -p app/src/main/jniLibs
        cp -r hev-build/libs/* app/src/main/jniLibs/
        find app/src/main/jniLibs -type f
    # --- akhir step tun2socks ---

    # --- Xray-core: ini TERBUKTI sukses download sebelumnya, tidak diubah ---
    - name: Download prebuilt libv2ray.aar (Xray-core)
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/libv2ray.aar \
          https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
        SIZE=$(stat -c%s app/libs/libv2ray.aar)
        echo "Ukuran file hasil download: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "::error::libv2ray.aar yang terdownload terlalu kecil ($SIZE bytes)"
          cat app/libs/libv2ray.aar
          exit 1
        fi
        ls -la app/libs/

    - name: Inspect libv2ray.aar contents
      run: |
        mkdir -p /tmp/aar-inspect
        cd /tmp/aar-inspect
        unzip -o -q "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"
        echo "=== Isi libv2ray.aar (top-level) ==="
        ls -la
        echo ""
        echo "=== Semua nama class di dalam classes.jar (filter yang mengandung 'ray' atau 'point', case-insensitive) ==="
        unzip -l classes.jar | grep -iE "ray|point" || echo "(tidak ada yang cocok filter, ini daftar SEMUA class:)"
        unzip -l classes.jar | head -100
        echo ""
        echo "=== javap -p pada semua class kandidat (yang namanya mengandung V2Ray/Libv2ray) ==="
        mkdir -p extracted
        cd extracted
        unzip -o -q ../classes.jar
        find . -iname "*.class" | grep -iE "v2ray|libv2ray" | while read -r f; do
          CLASSNAME=$(echo "$f" | sed 's|^\./||; s|\.class$||; s|/|.|g')
          echo "--- javap -p $CLASSNAME ---"
          javap -p -classpath . "$CLASSNAME" || true
          echo ""
        done

    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ./debug.keystore || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true -x test -x testDebugUnitTest

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HN-Tunnel-APK
        path: app/build/outputs/apk/debug/*.apk
