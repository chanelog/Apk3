name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27c

    - name: Clone & build hev-socks5-tunnel (tun2socks)
      run: |
        set -e
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel hev-build
        "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" -C hev-build/jni -j$(nproc)
        find hev-build/jni/libs -type f | head

    - name: Copy tun2socks .so to app/src/main/jniLibs
      run: |
        set -e
        mkdir -p app/src/main/jniLibs
        cp -r hev-build/jni/libs/* app/src/main/jniLibs/
        find app/src/main/jniLibs -type f

    - name: Download Xray Android arm64 binary
      run: |
        set -e
        rm -rf /tmp/xray-arm64
        mkdir -p /tmp/xray-arm64 app/src/main/jniLibs/arm64-v8a

        curl -fL \
          -o /tmp/xray-arm64.zip \
          https://github.com/XTLS/Xray-core/releases/download/v25.5.16/Xray-android-arm64-v8a.zip

        unzip -o /tmp/xray-arm64.zip -d /tmp/xray-arm64
        XRAY_BIN=$(find /tmp/xray-arm64 -type f -name xray | head -n 1)

        if [ -z "$XRAY_BIN" ]; then
          echo "::error::Binary Xray tidak ditemukan"
          find /tmp/xray-arm64 -type f
          exit 1
        fi

        cp "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so
        chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so

        echo "Binary Xray yang dipaketkan:"
        ls -l app/src/main/jniLibs/arm64-v8a/libxray.so
        file app/src/main/jniLibs/arm64-v8a/libxray.so

    - name: Download libv2ray.aar for legacy bridge compilation
      run: |
        set -e
        mkdir -p app/libs
        curl -fL \
          -o app/libs/libv2ray.aar \
          https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
        SIZE=$(stat -c%s app/libs/libv2ray.aar)
        echo "Ukuran libv2ray.aar: $SIZE bytes"
        if [ "$SIZE" -lt 10000 ]; then
          echo "::error::libv2ray.aar terlalu kecil atau download gagal"
          exit 1
        fi

    - name: Generate Debug Keystore
      run: |
        set -e
        mkdir -p ~/.android
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        cp ~/.android/debug.keystore ./debug.keystore || true

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f "gradlew" ]; then gradle wrapper; fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true -x test -x testDebugUnitTest

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HN-Tunnel-APK
        path: app/build/outputs/apk/debug/*.apk
        
